<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="dobuforge develops software.">
  <title>dobuforge</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.min.css?20260720">
  <link rel="stylesheet" href="assets/css/days-sober.min.css?20260829">
</head>

<body>
  <div id="layout" class="pure-g">
    <div class="sidebar pure-u-1 pure-u-lg-1-4">
      <div class="header">
        <h1 class="brand-title"><a href="/">dobuforge</a></h1>
        <h2 class="brand-tagline">We develop software.</h2>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a class="pure-button" href="./">Home</a>
              <a class="pure-button" href="products.html">Products</a>
              <a class="pure-button" href="contact.html">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <main class="content pure-u-1 pure-u-lg-3-4">
      <div class="posts">
        <h1 class="content-subhead">Days Sober</h1>
        <section class="post">
          <header class="post-header">
            <h2 class="post-title">断酒カウンター</h2>
          </header>
          <div class="post-description">
            <div class="sober-wrap">
              <section class="sober-card" aria-label="断酒カウンター">
                <div class="sober-card-header">
                  <div class="sober-icon" aria-hidden="true">♥</div>
                  <div>
                    <p class="sober-title">Your Sobriety Journey</p>
                    <p class="sober-since">Since June 25, 2026</p>
                  </div>
                </div>

                <div class="sober-days" id="sober-days">--</div>
                <div class="sober-label">Days Sober</div>

                <div class="sober-badge" id="sober-badge">Loading...</div>
              </section>
            </div>

            <section class="slip-card" aria-labelledby="slip-log-title">
              <div class="slip-card-header">
                <div>
                  <p class="slip-eyebrow">HISTORY</p>
                  <h3 class="slip-title" id="slip-log-title">Slip Log</h3>
                </div>
                <span class="slip-count">01</span>
              </div>

              <article class="slip-entry">
                <div class="slip-marker" aria-hidden="true"></div>
                <div class="slip-main">
                  <time class="slip-date" datetime="2026-08-28">AUG 28, 2026</time>
                  <span class="slip-location">At Home</span>
                  <div class="slip-period">
                    <time datetime="2026-06-25">Jun 25, 2026</time>
                    <span class="slip-line" aria-hidden="true"></span>
                    <time datetime="2026-08-28">Aug 28, 2026</time>
                  </div>
                  <span class="slip-caption">Previous sober period</span>
                </div>
                <div class="slip-duration">
                  <strong>65</strong>
                  <span>DAYS</span>
                </div>
              </article>
            </section>
          </div>
        </section>
      </div>
    </main>
  </div>
<script>
  (() => {
    const MS_PER_DAY = 24 * 60 * 60 * 1000;

    function dateOnlyUtc(year, month, day) {
      return Date.UTC(year, month - 1, day);
    }

    function todayOnlyUtc() {
      const now = new Date();
      return Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );
    }

    const startDate = dateOnlyUtc(2026, 6, 25);
    const today = todayOnlyUtc();

    const elapsedDays = Math.floor((today - startDate) / MS_PER_DAY);
    const daysSober = Math.max(0, elapsedDays + 1);

    document.getElementById("sober-days").textContent = daysSober;
    document.getElementById("sober-badge").textContent = `${daysSober} Days`;
  })();
</script>
</body>
</html>
