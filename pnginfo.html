<body><div id="layout" class="pure-g"><div class="sidebar pure-u-1 pure-u-lg-1-4"><div class="header"><h1 class="brand-title"><a href="/">dobuforge</a></h1><h2 class="brand-tagline">We develop software.</h2><nav class="nav"><ul class="nav-list"><li class="nav-item"><a class="pure-button" href="./">Home</a><a class="pure-button" href="products.html">Products</a><a class="pure-button" href="contact.html">Contact</a></li></ul></nav></div></div>
<main class="content pure-u-1 pure-u-lg-3-4"><div class="posts"><h1 class="content-subhead">Image Info</h1><section class="post"><header class="post-header"><h2 class="post-title">画像生成メタデータビューア</h2></header><div class="post-description">
<label class="png-drop" id="drop-zone" for="png-input"><span><span class="png-drop-icon" aria-hidden="true">⇩</span><span class="png-drop-title">DROP IMAGE HERE</span><span class="png-drop-help">PNG / WebP / JPEGをここへドロップ、またはクリックして選択</span><span class="png-drop-local">LOCAL ONLY · NO UPLOAD</span></span></label><input class="png-input" id="png-input" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg" multiple>
<div class="png-session-head" id="session-head" hidden><p class="png-session-label">SESSION IMAGE INFO</p><span class="png-count" id="png-count">0</span></div><section class="png-results" id="png-results" aria-live="polite"></section>
</div></section></div></main></div>
<script>(()=>{
const dropZone=document.getElementById('drop-zone'),input=document.getElementById('png-input'),results=document.getElementById('png-results'),sessionHead=document.getElementById('session-head'),count=document.getElementById('png-count'),decoder=new TextDecoder('utf-8'),latin1=new TextDecoder('iso-8859-1');let total=0;
const supported=/\.(png|webp|jpe?g)$/i;
['dragenter','dragover'].forEach(n=>dropZone.addEventListener(n,e=>{e.preventDefault();dropZone.classList.add('is-dragging')}));['dragleave','drop'].forEach(n=>dropZone.addEventListener(n,e=>{e.preventDefault();dropZone.classList.remove('is-dragging')}));dropZone.addEventListener('drop',e=>processFiles(e.dataTransfer.files));input.addEventListener('change',()=>{processFiles(input.files);input.value=''})
async function processFiles(list){const files=[...list].filter(f=>['image/png','image/webp','image/jpeg'].includes(f.type)||supported.test(f.name));for(const file of files){results.prepend(await makeCard(file));total++}if(total){sessionHead.hidden=false;count.textContent=total}}
async function makeCard(file){const card=el('article','png-entry'),head=el('div','png-entry-head');head.append(el('h3','png-entry-name',file.name));card.append(head);const body=el('div','png-entry-body'),img=document.createElement('img');img.className='png-preview';img.alt=file.name;img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);body.append(img);const meta=el('div','png-meta');body.append(meta);card.append(body);
try{const parsed=await parseImage(await file.arrayBuffer()),kind=parsed.format.toUpperCase();head.append(el('span','png-entry-kind',`${kind} INFO`));const text=parsed.items;const human=extractHuman(text);if(human.fields.length){const box=el('section','png-human'),title=el('div','png-human-title',`GENERATION INFO · ${human.source}`);box.append(title);for(const f of human.fields)addField(box,f.key,f.value,f.wide?'png-human-wide':'');meta.append(box)}
const preferred=['parameters','prompt','workflow'];let shown=0;const rawText=document.createElement('details');rawText.className='png-raw';const rawSummary=document.createElement('summary');rawSummary.textContent='Embedded generation metadata (Raw)';rawText.append(rawSummary);const rawBody=el('div','png-raw-body');for(const key of preferred)for(const item of text.filter(x=>x.keyword.toLowerCase()===key)){addField(rawBody,key,pretty(item.value));shown++}for(const item of text.filter(x=>!preferred.includes(x.keyword.toLowerCase()))){addField(rawBody,item.keyword,pretty(item.value));shown++}if(shown){rawText.append(rawBody);meta.append(rawText)}else addField(meta,'Metadata',`No supported textual ${kind} metadata found.`,'png-empty');
const raw=document.createElement('details');raw.className='png-raw';const summary=document.createElement('summary');summary.textContent=`Raw ${kind} metadata blocks`;raw.append(summary,el('pre','png-value',parsed.raw.join('\n\n')||'(none)'));meta.append(raw)}catch(err){head.append(el('span','png-entry-kind','IMAGE INFO'));addField(meta,'Error',err.message||String(err),'png-error')}return card}
function extractHuman(items){const p=items.find(x=>x.keyword.toLowerCase()==='parameters')||items.find(x=>isA1111(String(x.value))),q=items.find(x=>x.keyword.toLowerCase()==='prompt'&&isComfy(String(x.value)))||items.find(x=>findComfyJson(String(x.value)));if(p)return extractA1111(p.value);if(q){const json=findComfyJson(String(q.value))||String(q.value);return extractComfy(json)}return{source:'Image',fields:[]}}
function extractA1111(value){const s=String(value),marker='Negative prompt:',idx=s.indexOf(marker);let positive=idx>=0?s.slice(0,idx).trim():s.trim(),rest=idx>=0?s.slice(idx+marker.length).trim():'';let negative='',settings='';const m=rest.match(/\nSteps:\s*/);if(m){negative=rest.slice(0,m.index).trim();settings='Steps: '+rest.slice(m.index+m[0].length)}else if(idx<0){const sm=s.match(/\nSteps:\s*/);if(sm){positive=s.slice(0,sm.index).trim();settings='Steps: '+s.slice(sm.index+sm[0].length)}}const fields=[];if(positive)fields.push({key:'Positive Prompt',value:positive,wide:true});if(negative)fields.push({key:'Negative Prompt',value:negative,wide:true});if(settings){const map=parseSettings(settings);for(const [key,val] of Object.entries(map))fields.push({key,value:val})}return{source:'Forge / A1111',fields}}
function parseSettings(s){const out={};for(const part of splitCommaAware(s)){const i=part.indexOf(':');if(i>0)out[part.slice(0,i).trim()]=part.slice(i+1).trim()}return out}
function splitCommaAware(s){const a=[];let start=0,depth=0,quote='';for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c===quote&&s[i-1]!=='\\')quote='';continue}if(c==='"'||c==="'"){quote=c;continue}if('([{'.includes(c))depth++;else if(')]}'.includes(c))depth=Math.max(0,depth-1);else if(c===','&&depth===0){a.push(s.slice(start,i).trim());start=i+1}}a.push(s.slice(start).trim());return a.filter(Boolean)}
function extractComfy(value){let graph;try{graph=JSON.parse(value)}catch{return{source:'ComfyUI',fields:[]}}const nodes=Object.entries(graph).filter(([,n])=>n&&typeof n==='object'),fields=[],samplers=nodes.filter(([,n])=>/sampler/i.test(n.class_type||'')&&n.inputs);const texts=nodes.filter(([,n])=>/textencode/i.test(n.class_type||'')&&typeof n.inputs?.text==='string');const roles=new Map();for(const [id] of texts){let role='Prompt';for(const [,sam] of samplers){if(refersTo(sam.inputs?.positive,id))role='Positive Prompt';if(refersTo(sam.inputs?.negative,id))role='Negative Prompt'}roles.set(id,role)}const positives=texts.filter(([id])=>roles.get(id)==='Positive Prompt'),negatives=texts.filter(([id])=>roles.get(id)==='Negative Prompt');if(positives.length)fields.push({key:'Positive Prompt',value:positives.map(([,n])=>n.inputs.text).join('\n\n'),wide:true});if(negatives.length)fields.push({key:'Negative Prompt',value:negatives.map(([,n])=>n.inputs.text).join('\n\n'),wide:true});const sampler=samplers[0]?.[1]?.inputs;if(sampler){for(const [src,key] of [['seed','Seed'],['steps','Steps'],['cfg','CFG'],['sampler_name','Sampler'],['scheduler','Scheduler'],['denoise','Denoise']])if(sampler[src]!==undefined&&!Array.isArray(sampler[src]))fields.push({key,value:String(sampler[src])})}const models=[];for(const [,n] of nodes){const i=n.inputs||{};for(const k of ['ckpt_name','unet_name','model_name'])if(typeof i[k]==='string')models.push(i[k])}if(models.length)fields.push({key:'Model',value:[...new Set(models)].join('\n'),wide:true});const loras=[];for(const [,n] of nodes){const i=n.inputs||{};for(const [k,v] of Object.entries(i))if(/lora.*name|lora_name/i.test(k)&&typeof v==='string')loras.push(v)}if(loras.length)fields.push({key:'LoRA',value:[...new Set(loras)].join('\n'),wide:true});return{source:'ComfyUI',fields}}
function refersTo(v,id){return Array.isArray(v)&&String(v[0])===String(id)}
async function parseImage(buffer){const b=new Uint8Array(buffer);if(isPng(b))return{format:'PNG',items:(await parsePng(buffer)).filter(c=>c.keyword).map(c=>({keyword:c.keyword,value:c.text,type:c.type})),raw:(await parsePng(buffer)).map(c=>c.keyword?`${c.type} · ${c.keyword}\n${c.text}`:`${c.type} (${c.length} bytes)`)};if(b[0]===0xff&&b[1]===0xd8)return parseJpeg(b);if(ascii(b.subarray(0,4))==='RIFF'&&ascii(b.subarray(8,12))==='WEBP')return parseWebp(b);throw new Error('Unsupported image format.')}
function isPng(b){const s=[137,80,78,71,13,10,26,10];return s.every((v,i)=>b[i]===v)}
async function parsePng(buffer){const bytes=new Uint8Array(buffer),view=new DataView(buffer);if(!isPng(bytes))throw new Error('PNG signature not found.');const out=[];let p=8;while(p+12<=bytes.length){const length=view.getUint32(p),type=ascii(bytes.subarray(p+4,p+8)),start=p+8,end=start+length;if(end+4>bytes.length)throw new Error('Broken PNG chunk.');const data=bytes.subarray(start,end),item={type,length};if(type==='tEXt')Object.assign(item,parseText(data));else if(type==='zTXt')Object.assign(item,await parseZText(data));else if(type==='iTXt')Object.assign(item,await parseIText(data));out.push(item);p=end+4;if(type==='IEND')break}return out}
function parseWebp(bytes){const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),items=[],raw=[];let p=12;while(p+8<=bytes.length){const type=ascii(bytes.subarray(p,p+4)),len=view.getUint32(p+4,true),start=p+8,end=start+len;if(end>bytes.length)throw new Error('Broken WebP chunk.');const data=bytes.subarray(start,end);if(type==='EXIF'){for(const s of readExifStrings(stripExifPrefix(data)))items.push(classifyText(s,'EXIF'));raw.push(`EXIF (${len} bytes)`)}else if(type==='XMP '){const s=decodeText(data);items.push(classifyText(s,'XMP'));raw.push(`XMP\n${s}`)}p=end+(len&1)}return{format:'WebP',items:items.filter(Boolean),raw}}
function parseJpeg(bytes){const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),items=[],raw=[];let p=2,hasImage=false;while(p<bytes.length){if(bytes[p++]!==0xff)throw new Error('Broken JPEG marker.');while(bytes[p]===0xff)p++;const marker=bytes[p++];if(marker===0xd9||marker===0xda)break;if(marker===0x01||(marker>=0xd0&&marker<=0xd8))continue;if(p+2>bytes.length)throw new Error('Broken JPEG segment.');const segLen=view.getUint16(p,false);p+=2;if(segLen<2||p+segLen-2>bytes.length)throw new Error('Broken JPEG segment.');const data=bytes.subarray(p,p+segLen-2);if(isSof(marker))hasImage=true;if(marker===0xe1&&starts(data,'Exif\0\0')){for(const s of readExifStrings(data.subarray(6)))items.push(classifyText(s,'EXIF'));raw.push(`APP1 EXIF (${data.length} bytes)`)}else if(marker===0xe1&&starts(data,'http://ns.adobe.com/xap/1.0/\0')){const s=decodeText(data.subarray(29));items.push(classifyText(s,'XMP'));raw.push(`APP1 XMP\n${s}`)}else if(marker===0xed||marker===0xfe){const s=decodeText(data);items.push(classifyText(s,marker===0xfe?'COM':'APP13'));raw.push(`${marker===0xfe?'COM':'APP13'}\n${s}`)}p+=segLen-2}if(!hasImage)throw new Error('JPEG image data not found.');return{format:'JPEG',items:items.filter(Boolean),raw}}
function classifyText(value,source){const s=String(value).replace(/\0+$/,'');if(!s.trim())return null;if(isA1111(s))return{keyword:'parameters',value:s,type:source};const comfy=findComfyJson(s);if(comfy)return{keyword:'prompt',value:comfy,type:source};return{keyword:source.toLowerCase(),value:s,type:source}}
function isA1111(s){return /Steps:/i.test(s)&&/Sampler:/i.test(s)&&/Seed:/i.test(s)}
function isComfy(s){try{const o=JSON.parse(s);return o&&typeof o==='object'&&Object.values(o).some(n=>n&&typeof n==='object'&&typeof n.class_type==='string'&&n.inputs&&typeof n.inputs==='object')}catch{return false}}
function findComfyJson(s){const t=decodeHtml(String(s)).replace(/^\0+|\0+$/g,'').trim();if(isComfy(t))return t;for(let start=t.indexOf('{');start>=0;start=t.indexOf('{',start+1)){const j=extractJson(t,start);if(j&&isComfy(j))return j}return null}
function extractJson(s,start){let d=0,q=false,e=false;for(let i=start;i<s.length;i++){const c=s[i];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false;continue}if(c==='"')q=true;else if(c==='{')d++;else if(c==='}'&&--d===0)return s.slice(start,i+1)}return null}
function readExifStrings(tiff){const out=[];if(tiff.length<8)return out;const le=tiff[0]===0x49&&tiff[1]===0x49;if(!le&&!(tiff[0]===0x4d&&tiff[1]===0x4d))return out;const view=new DataView(tiff.buffer,tiff.byteOffset,tiff.byteLength);const u16=o=>view.getUint16(o,le),u32=o=>view.getUint32(o,le);if(u16(2)!==42)return out;const stack=[u32(4)],seen=new Set;while(stack.length&&seen.size<16){const off=stack.pop();if(seen.has(off)||off+2>tiff.length)continue;seen.add(off);const count=u16(off),base=off+2;if(base+count*12+4>tiff.length)continue;for(let i=0;i<count;i++){const e=base+i*12,tag=u16(e),type=u16(e+2),cnt=u32(e+4);if(tag===0x8769&&type===4&&cnt===1){stack.push(u32(e+8));continue}if(![0x010e,0x02bc,0x9286,0x9c9c].includes(tag)||![1,2,7].includes(type)||!cnt||cnt>67108864)continue;const pos=cnt<=4?e+8:u32(e+8);if(pos+cnt>tiff.length)continue;const v=tiff.subarray(pos,pos+cnt);out.push(tag===0x9286?decodeUserComment(v,le):tag===0x9c9c?decodeUtf16Le(v):decodeText(v))}const next=u32(base+count*12);if(next)stack.push(next)}return out}
function stripExifPrefix(d){return starts(d,'Exif\0\0')?d.subarray(6):d}
function decodeUserComment(v,le){if(starts(v,'ASCII\0\0\0'))return new TextDecoder('ascii').decode(v.subarray(8)).replace(/\0+$/,'');if(starts(v,'UNICODE\0')){const x=v.subarray(8);if(x[0]===0xff&&x[1]===0xfe)return decodeUtf16Le(x.subarray(2));if(x[0]===0xfe&&x[1]===0xff)return decodeUtf16Be(x.subarray(2));return le?decodeUtf16Le(x):decodeUtf16Be(x)}if(starts(v,'JIS\0\0\0\0\0'))return new TextDecoder('ascii').decode(v.subarray(8)).replace(/\0+$/,'');return decodeText(v)}
function decodeUtf16Le(v){let s='';for(let i=0;i+1<v.length;i+=2)s+=String.fromCharCode(v[i]|v[i+1]<<8);return s.replace(/\0+$/,'')}
function decodeUtf16Be(v){let s='';for(let i=0;i+1<v.length;i+=2)s+=String.fromCharCode(v[i]<<8|v[i+1]);return s.replace(/\0+$/,'')}
function decodeText(v){try{return new TextDecoder('utf-8',{fatal:true}).decode(v).replace(/\0+$/,'')}catch{return latin1.decode(v).replace(/\0+$/,'')}}
function starts(bytes,s){const a=new TextEncoder().encode(s);return a.every((v,i)=>bytes[i]===v)}
function isSof(m){return m>=0xc0&&m<=0xcf&&![0xc4,0xc8,0xcc].includes(m)}
function decodeHtml(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value}
function parseText(data){const n=data.indexOf(0);if(n<0)return{};return{keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(data.subarray(n+1))}}async function parseZText(data){const n=data.indexOf(0);if(n<0||n+2>data.length)return{};return{keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(await inflate(data.subarray(n+2)))}}async function parseIText(data){let p=data.indexOf(0);if(p<0||p+3>data.length)return{};const keyword=latin1.decode(data.subarray(0,p)),compressed=data[p+1]===1;p+=3;let n=data.indexOf(0,p);if(n<0)return{};p=n+1;n=data.indexOf(0,p);if(n<0)return{};p=n+1;const payload=data.subarray(p),decoded=compressed?await inflate(payload):payload;return{keyword,text:decoder.decode(decoded)}}async function inflate(data){if(typeof DecompressionStream==='undefined')throw new Error('Compressed PNG metadata is not supported by this browser.');const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate'));return new Uint8Array(await new Response(stream).arrayBuffer())}function ascii(b){return String.fromCharCode(...b)}function pretty(v){const s=String(v);try{return JSON.stringify(JSON.parse(s),null,2)}catch{return s}}function addField(parent,key,value,extra=''){const field=el('div',`png-field ${extra}`.trim());field.append(el('span','png-key',key),el('pre','png-value',value));parent.append(field)}function el(tag,cls,text){const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n}
})();</script></body></html>
