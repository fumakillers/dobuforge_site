<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inspect PNG generation metadata locally in your browser.">
  <title>PNG Info - dobuforge</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.min.css?20260720">
  <link rel="stylesheet" href="assets/css/pnginfo.min.css?20260830">
</head>
<body>
  <div id="layout" class="pure-g">
    <div class="sidebar pure-u-1 pure-u-lg-1-4">
      <div class="header">
        <h1 class="brand-title"><a href="/">dobuforge</a></h1>
        <h2 class="brand-tagline">We develop software.</h2>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a class="pure-button" href="./">Home</a>
              <a class="pure-button" href="products.html">Products</a>
              <a class="pure-button" href="contact.html">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <main class="content pure-u-1 pure-u-lg-3-4">
      <div class="posts">
        <h1 class="content-subhead">PNG Info</h1>
        <section class="post">
          <header class="post-header"><h2 class="post-title">PNGメタデータビューア</h2></header>
          <div class="post-description">
            <label class="png-drop" id="drop-zone" for="png-input">
              <span>
                <span class="png-drop-icon" aria-hidden="true">⇩</span>
                <span class="png-drop-title">DROP PNG HERE</span>
                <span class="png-drop-help">PNGをここへドロップ、またはクリックして選択</span>
                <span class="png-drop-local">LOCAL ONLY · NO UPLOAD</span>
              </span>
            </label>
            <input class="png-input" id="png-input" type="file" accept="image/png,.png" multiple>
            <div class="png-session-head" id="session-head" hidden>
              <p class="png-session-label">SESSION PNG INFO</p><span class="png-count" id="png-count">0</span>
            </div>
            <section class="png-results" id="png-results" aria-live="polite"></section>
          </div>
        </section>
      </div>
    </main>
  </div>
<script>
(() => {
  const dropZone = document.getElementById('drop-zone');
  const input = document.getElementById('png-input');
  const results = document.getElementById('png-results');
  const sessionHead = document.getElementById('session-head');
  const count = document.getElementById('png-count');
  const decoder = new TextDecoder('utf-8');
  const latin1 = new TextDecoder('iso-8859-1');
  let total = 0;

  ['dragenter','dragover'].forEach(name => dropZone.addEventListener(name, e => { e.preventDefault(); dropZone.classList.add('is-dragging'); }));
  ['dragleave','drop'].forEach(name => dropZone.addEventListener(name, e => { e.preventDefault(); dropZone.classList.remove('is-dragging'); }));
  dropZone.addEventListener('drop', e => processFiles(e.dataTransfer.files));
  input.addEventListener('change', () => { processFiles(input.files); input.value = ''; });

  async function processFiles(fileList) {
    const files = [...fileList].filter(f => f.type === 'image/png' || f.name.toLowerCase().endsWith('.png'));
    for (const file of files) {
      const card = await makeCard(file);
      results.prepend(card);
      total++;
    }
    if (total) { sessionHead.hidden = false; count.textContent = total; }
  }

  async function makeCard(file) {
    const card = el('article','png-entry');
    const head = el('div','png-entry-head');
    head.append(el('h3','png-entry-name',file.name), el('span','png-entry-kind','PNG INFO'));
    card.append(head);
    const body = el('div','png-entry-body');
    const img = document.createElement('img'); img.className='png-preview'; img.alt=file.name; img.src=URL.createObjectURL(file); img.onload=()=>URL.revokeObjectURL(img.src);
    body.append(img);
    const meta = el('div','png-meta'); body.append(meta); card.append(body);
    try {
      const chunks = await parsePng(await file.arrayBuffer());
      const text = chunks.filter(c => c.keyword).map(c => ({keyword:c.keyword, value:c.text, type:c.type}));
      const preferred = ['parameters','prompt','workflow'];
      let shown = 0;
      for (const key of preferred) {
        for (const item of text.filter(x => x.keyword.toLowerCase() === key)) { addField(meta, key, pretty(item.value)); shown++; }
      }
      for (const item of text.filter(x => !preferred.includes(x.keyword.toLowerCase()))) { addField(meta, item.keyword, pretty(item.value)); shown++; }
      if (!shown) addField(meta,'Metadata','No textual PNG metadata found.','png-empty');
      const raw = document.createElement('details'); raw.className='png-raw';
      const summary=document.createElement('summary'); summary.textContent='Raw PNG chunks'; raw.append(summary);
      const rawValue=el('pre','png-value',chunks.map(c => c.keyword ? `${c.type} · ${c.keyword}\n${c.text}` : `${c.type} (${c.length} bytes)`).join('\n\n')); raw.append(rawValue); meta.append(raw);
    } catch (err) { addField(meta,'Error',err.message || String(err),'png-error'); }
    return card;
  }

  async function parsePng(buffer) {
    const bytes=new Uint8Array(buffer), view=new DataView(buffer);
    const sig=[137,80,78,71,13,10,26,10]; if(sig.some((v,i)=>bytes[i]!==v)) throw new Error('PNG signature not found.');
    const out=[]; let p=8;
    while(p+12<=bytes.length){
      const length=view.getUint32(p); const type=ascii(bytes.subarray(p+4,p+8)); const start=p+8, end=start+length;
      if(end+4>bytes.length) throw new Error('Broken PNG chunk.');
      const data=bytes.subarray(start,end); const item={type,length};
      if(type==='tEXt') Object.assign(item,parseText(data));
      else if(type==='zTXt') Object.assign(item,await parseZText(data));
      else if(type==='iTXt') Object.assign(item,await parseIText(data));
      out.push(item); p=end+4; if(type==='IEND') break;
    }
    return out;
  }
  function parseText(data){ const n=data.indexOf(0); if(n<0)return{}; return {keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(data.subarray(n+1))}; }
  async function parseZText(data){ const n=data.indexOf(0); if(n<0||n+2>data.length)return{}; return {keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(await inflate(data.subarray(n+2)))}; }
  async function parseIText(data){
    let p=data.indexOf(0); if(p<0||p+3>data.length)return{}; const keyword=latin1.decode(data.subarray(0,p)); const compressed=data[p+1]===1; p+=3;
    let n=data.indexOf(0,p); if(n<0)return{}; p=n+1; n=data.indexOf(0,p); if(n<0)return{}; p=n+1;
    const payload=data.subarray(p); const decoded=compressed ? await inflate(payload) : payload;
    return {keyword,text:decoder.decode(decoded)};
  }
  async function inflate(data){
    if(typeof DecompressionStream==='undefined') throw new Error('Compressed PNG metadata is not supported by this browser.');
    const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function ascii(b){ return String.fromCharCode(...b); }
  function pretty(value){
    const s=String(value); try { return JSON.stringify(JSON.parse(s),null,2); } catch { return s; }
  }
  function addField(parent,key,value,extra=''){
    const field=el('div','png-field'); field.append(el('span','png-key',key),el('pre',`png-value ${extra}`.trim(),value)); parent.append(field);
  }
  function el(tag,className,text){ const node=document.createElement(tag); node.className=className; if(text!==undefined) node.textContent=text; return node; }
})();
</script>
</body>
</html>
