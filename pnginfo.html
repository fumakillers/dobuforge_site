<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/styles.min.css?20260720"><link rel="stylesheet" href="assets/css/pnginfo.min.css?20260830b">
</head>
<body><div id="layout" class="pure-g"><div class="sidebar pure-u-1 pure-u-lg-1-4"><div class="header"><h1 class="brand-title"><a href="/">dobuforge</a></h1><h2 class="brand-tagline">We develop software.</h2><nav class="nav"><ul class="nav-list"><li class="nav-item"><a class="pure-button" href="./">Home</a><a class="pure-button" href="products.html">Products</a><a class="pure-button" href="contact.html">Contact</a></li></ul></nav></div></div>
<main class="content pure-u-1 pure-u-lg-3-4"><div class="posts"><h1 class="content-subhead">PNG Info</h1><section class="post"><header class="post-header"><h2 class="post-title">PNGメタデータビューア</h2></header><div class="post-description">
<label class="png-drop" id="drop-zone" for="png-input"><span><span class="png-drop-icon" aria-hidden="true">⇩</span><span class="png-drop-title">DROP PNG HERE</span><span class="png-drop-help">PNGをここへドロップ、またはクリックして選択</span><span class="png-drop-local">LOCAL ONLY · NO UPLOAD</span></span></label><input class="png-input" id="png-input" type="file" accept="image/png,.png" multiple>
<div class="png-session-head" id="session-head" hidden><p class="png-session-label">SESSION PNG INFO</p><span class="png-count" id="png-count">0</span></div><section class="png-results" id="png-results" aria-live="polite"></section>
</div></section></div></main></div>
<script>(()=>{
const dropZone=document.getElementById('drop-zone'),input=document.getElementById('png-input'),results=document.getElementById('png-results'),sessionHead=document.getElementById('session-head'),count=document.getElementById('png-count'),decoder=new TextDecoder('utf-8'),latin1=new TextDecoder('iso-8859-1');let total=0;
['dragenter','dragover'].forEach(n=>dropZone.addEventListener(n,e=>{e.preventDefault();dropZone.classList.add('is-dragging')}));['dragleave','drop'].forEach(n=>dropZone.addEventListener(n,e=>{e.preventDefault();dropZone.classList.remove('is-dragging')}));dropZone.addEventListener('drop',e=>processFiles(e.dataTransfer.files));input.addEventListener('change',()=>{processFiles(input.files);input.value=''})
async function processFiles(list){const files=[...list].filter(f=>f.type==='image/png'||f.name.toLowerCase().endsWith('.png'));for(const file of files){results.prepend(await makeCard(file));total++}if(total){sessionHead.hidden=false;count.textContent=total}}
async function makeCard(file){const card=el('article','png-entry'),head=el('div','png-entry-head');head.append(el('h3','png-entry-name',file.name),el('span','png-entry-kind','PNG INFO'));card.append(head);const body=el('div','png-entry-body'),img=document.createElement('img');img.className='png-preview';img.alt=file.name;img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);body.append(img);const meta=el('div','png-meta');body.append(meta);card.append(body);
try{const chunks=await parsePng(await file.arrayBuffer()),text=chunks.filter(c=>c.keyword).map(c=>({keyword:c.keyword,value:c.text,type:c.type}));const human=extractHuman(text);if(human.fields.length){const box=el('section','png-human'),title=el('div','png-human-title',`GENERATION INFO · ${human.source}`);box.append(title);for(const f of human.fields)addField(box,f.key,f.value,f.wide?'png-human-wide':'');meta.append(box)}
const preferred=['parameters','prompt','workflow'];let shown=0;const rawText=document.createElement('details');rawText.className='png-raw';const rawSummary=document.createElement('summary');rawSummary.textContent='Embedded generation metadata (Raw)';rawText.append(rawSummary);const rawBody=el('div','png-raw-body');for(const key of preferred)for(const item of text.filter(x=>x.keyword.toLowerCase()===key)){addField(rawBody,key,pretty(item.value));shown++}for(const item of text.filter(x=>!preferred.includes(x.keyword.toLowerCase()))){addField(rawBody,item.keyword,pretty(item.value));shown++}if(shown){rawText.append(rawBody);meta.append(rawText)}else addField(meta,'Metadata','No textual PNG metadata found.','png-empty');
const raw=document.createElement('details');raw.className='png-raw';const summary=document.createElement('summary');summary.textContent='Raw PNG chunks';raw.append(summary,el('pre','png-value',chunks.map(c=>c.keyword?`${c.type} · ${c.keyword}\n${c.text}`:`${c.type} (${c.length} bytes)`).join('\n\n')));meta.append(raw)}catch(err){addField(meta,'Error',err.message||String(err),'png-error')}return card}
function extractHuman(items){const p=items.find(x=>x.keyword.toLowerCase()==='parameters'),q=items.find(x=>x.keyword.toLowerCase()==='prompt');if(p)return extractA1111(p.value);if(q)return extractComfy(q.value);return{source:'PNG',fields:[]}}
function extractA1111(value){const s=String(value),marker='Negative prompt:',idx=s.indexOf(marker);let positive=idx>=0?s.slice(0,idx).trim():s.trim(),rest=idx>=0?s.slice(idx+marker.length).trim():'';let negative='',settings='';const m=rest.match(/\nSteps:\s*/);if(m){negative=rest.slice(0,m.index).trim();settings='Steps: '+rest.slice(m.index+m[0].length)}else if(idx<0){const sm=s.match(/\nSteps:\s*/);if(sm){positive=s.slice(0,sm.index).trim();settings='Steps: '+s.slice(sm.index+sm[0].length)}}const fields=[];if(positive)fields.push({key:'Positive Prompt',value:positive,wide:true});if(negative)fields.push({key:'Negative Prompt',value:negative,wide:true});if(settings){const map=parseSettings(settings);for(const [key,val] of Object.entries(map))fields.push({key,value:val})}return{source:'Forge / A1111',fields}}
function parseSettings(s){const out={};for(const part of splitCommaAware(s)){const i=part.indexOf(':');if(i>0)out[part.slice(0,i).trim()]=part.slice(i+1).trim()}return out}
function splitCommaAware(s){const a=[];let start=0,depth=0,quote='';for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c===quote&&s[i-1]!=='\\')quote='';continue}if(c==='"'||c==="'"){quote=c;continue}if('([{'.includes(c))depth++;else if(')]}'.includes(c))depth=Math.max(0,depth-1);else if(c===','&&depth===0){a.push(s.slice(start,i).trim());start=i+1}}a.push(s.slice(start).trim());return a.filter(Boolean)}
function extractComfy(value){let graph;try{graph=JSON.parse(value)}catch{return{source:'ComfyUI',fields:[]}}const nodes=Object.entries(graph).filter(([,n])=>n&&typeof n==='object'),fields=[],samplers=nodes.filter(([,n])=>/sampler/i.test(n.class_type||'')&&n.inputs);const texts=nodes.filter(([,n])=>/textencode/i.test(n.class_type||'')&&typeof n.inputs?.text==='string');
const roles=new Map();for(const [id,n] of texts){let role='Prompt';for(const [,sam] of samplers){if(refersTo(sam.inputs?.positive,id))role='Positive Prompt';if(refersTo(sam.inputs?.negative,id))role='Negative Prompt'}roles.set(id,role)}const positives=texts.filter(([id])=>roles.get(id)==='Positive Prompt'),negatives=texts.filter(([id])=>roles.get(id)==='Negative Prompt');if(positives.length)fields.push({key:'Positive Prompt',value:positives.map(([,n])=>n.inputs.text).join('\n\n'),wide:true});if(negatives.length)fields.push({key:'Negative Prompt',value:negatives.map(([,n])=>n.inputs.text).join('\n\n'),wide:true});
const sampler=samplers[0]?.[1]?.inputs;if(sampler){for(const [src,key] of [['seed','Seed'],['steps','Steps'],['cfg','CFG'],['sampler_name','Sampler'],['scheduler','Scheduler'],['denoise','Denoise']])if(sampler[src]!==undefined&&!Array.isArray(sampler[src]))fields.push({key,value:String(sampler[src])})}
const models=[];for(const [,n] of nodes){const i=n.inputs||{};for(const k of ['ckpt_name','unet_name','model_name'])if(typeof i[k]==='string')models.push(i[k])}if(models.length)fields.push({key:'Model',value:[...new Set(models)].join('\n'),wide:true});const loras=[];for(const [,n] of nodes){const i=n.inputs||{};for(const [k,v] of Object.entries(i))if(/lora.*name|lora_name/i.test(k)&&typeof v==='string')loras.push(v)}if(loras.length)fields.push({key:'LoRA',value:[...new Set(loras)].join('\n'),wide:true});return{source:'ComfyUI',fields}}
function refersTo(v,id){return Array.isArray(v)&&String(v[0])===String(id)}
async function parsePng(buffer){const bytes=new Uint8Array(buffer),view=new DataView(buffer),sig=[137,80,78,71,13,10,26,10];if(sig.some((v,i)=>bytes[i]!==v))throw new Error('PNG signature not found.');const out=[];let p=8;while(p+12<=bytes.length){const length=view.getUint32(p),type=ascii(bytes.subarray(p+4,p+8)),start=p+8,end=start+length;if(end+4>bytes.length)throw new Error('Broken PNG chunk.');const data=bytes.subarray(start,end),item={type,length};if(type==='tEXt')Object.assign(item,parseText(data));else if(type==='zTXt')Object.assign(item,await parseZText(data));else if(type==='iTXt')Object.assign(item,await parseIText(data));out.push(item);p=end+4;if(type==='IEND')break}return out}
function parseText(data){const n=data.indexOf(0);if(n<0)return{};return{keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(data.subarray(n+1))}}async function parseZText(data){const n=data.indexOf(0);if(n<0||n+2>data.length)return{};return{keyword:latin1.decode(data.subarray(0,n)),text:latin1.decode(await inflate(data.subarray(n+2)))}}async function parseIText(data){let p=data.indexOf(0);if(p<0||p+3>data.length)return{};const keyword=latin1.decode(data.subarray(0,p)),compressed=data[p+1]===1;p+=3;let n=data.indexOf(0,p);if(n<0)return{};p=n+1;n=data.indexOf(0,p);if(n<0)return{};p=n+1;const payload=data.subarray(p),decoded=compressed?await inflate(payload):payload;return{keyword,text:decoder.decode(decoded)}}async function inflate(data){if(typeof DecompressionStream==='undefined')throw new Error('Compressed PNG metadata is not supported by this browser.');const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate'));return new Uint8Array(await new Response(stream).arrayBuffer())}function ascii(b){return String.fromCharCode(...b)}function pretty(v){const s=String(v);try{return JSON.stringify(JSON.parse(s),null,2)}catch{return s}}function addField(parent,key,value,extra=''){const field=el('div',`png-field ${extra}`.trim());field.append(el('span','png-key',key),el('pre','png-value',value));parent.append(field)}function el(tag,cls,text){const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n}
})();</script></body></html>
